<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Rat - Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 200px;
      height: 100vh;
      margin: 0;
    }
    h1 { margin-bottom: 20px; color: #FFD700; }
    .form-box {
      background: #222;
      padding: 20px;
      border-radius: 12px;
      width: 300px;
      box-shadow: 0 0 15px #FFD700;
      display: flex;
      flex-direction: column;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
      outline: none;
      font-size: 1em;
    }
    input { background: #333; color: #eee; }
    button { background: #FFD700; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #FFD700; }
    .msg { margin-top: 10px; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>Gym Rat 🐀</h1>
  <div class="form-box">
    <input id="nombre" placeholder="Nombre (solo al registrarse)">
    <input id="email" placeholder="Email" type="email">
    <input id="password" placeholder="Contraseña" type="password">
    <button onclick="login()">Iniciar sesión</button>
    <button onclick="register()">Registrarse</button>
    <button onclick="verUsuarios()">Ver usuarios (solo admins)</button>
    <button onclick="logout()">Cerrar sesión</button>
    <div id="msg" class="msg"></div>
    <div id="usuariosList" class="msg"></div>
  </div>

  <script>
    const apiUrl = "/auth";

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");

      const res = await fetch(`${apiUrl}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json().catch(() => null);

      if (!res.ok) {
        msg.textContent = typeof data === "string" ? data : "❌ Error en login.";
        msg.style.color = "red";
        return;
      }

      localStorage.setItem("accessToken", data.accessToken);
      localStorage.setItem("refreshToken", data.refreshToken);
      msg.textContent = "✅ Login exitoso. Bienvenido, " + data.nombre;
      msg.style.color = "lime";
    }

    async function register() {
      const nombre = document.getElementById("nombre").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");

      const res = await fetch(`${apiUrl}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, email, password })
      });

      const text = await res.text();
      msg.textContent = text;
      msg.style.color = res.ok ? "lime" : "red";
    }

    async function renovarAccessToken() {
      const refreshToken = localStorage.getItem("refreshToken");
      if (!refreshToken) return;

      try {
        const res = await fetch(`${apiUrl}/refresh`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ refreshToken })
        });
        const data = await res.json();
        if (res.ok && data.accessToken) {
          localStorage.setItem("accessToken", data.accessToken);
        } else {
          logout();
        }
      } catch {
        logout();
      }
    }

    async function verUsuarios() {
      const usuariosDiv = document.getElementById("usuariosList");
      let accessToken = localStorage.getItem("accessToken");

      if (!accessToken) {
        usuariosDiv.textContent = "❌ No estás logueado.";
        usuariosDiv.style.color = "red";
        return;
      }

      const res = await fetch("/usuarios", {
        headers: { "Authorization": `Bearer ${accessToken}` }
      });

      if (res.status === 401) {
        await renovarAccessToken();
        accessToken = localStorage.getItem("accessToken");
        if (!accessToken) {
          usuariosDiv.textContent = "❌ Sesión expirada.";
          usuariosDiv.style.color = "red";
          return;
        }
        return verUsuarios();
      }

      if (!res.ok) {
        usuariosDiv.textContent = `❌ Error: ${res.status} ${res.statusText}`;
        usuariosDiv.style.color = "red";
        return;
      }

      const usuarios = await res.json();
      usuariosDiv.innerHTML = "<strong>Usuarios:</strong><br>" +
        usuarios.map(u => `${u.nombre} (${u.email})`).join("<br>");
      usuariosDiv.style.color = "lime";
    }

    function logout() {
      localStorage.removeItem("accessToken");
      localStorage.removeItem("refreshToken");
      document.getElementById("msg").textContent = "🔒 Sesión cerrada.";
      document.getElementById("msg").style.color = "yellow";
      document.getElementById("usuariosList").textContent = "";
    }

    window.onload = renovarAccessToken;
  </script>
</body>
</html>
