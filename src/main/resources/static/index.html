<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Rat - Login</title>
  <style>
    * {
      box-sizing: border-box; /* importante para ancho consistente */
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 200px; /* ajusta el número a tu gusto para mover todo el inicio de sesion. Cuidado con la vista movil pero o hace falta porque es una app */
      height: 100vh;
      margin: 0;
    }

    h1 { 
      margin-bottom: 20px; 
      color: #FFD700; 
    }

    .form-box {
      background: #222;
      padding: 20px;
      border-radius: 12px;
      width: 300px;
      box-shadow: 0 0 15px #FFD700;
      display: flex;
      flex-direction: column;
    }

    input, button {
      width: 100%; /* iguala el ancho de inputs y botones */
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
      outline: none;
      font-size: 1em;
    }

    input {
      background: #333;
      color: #eee;
    }

    button {
      background: #FFD700;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #FFD700;
    }

    .msg { 
      margin-top: 10px; 
      font-size: 0.9em; 
    }
  </style>
</head>
<body>
  <h1>Gym Rat 🐀</h1>  /* Cambiar por rata alzando pesas */
  <div class="form-box">
    <input id="nombre" placeholder="Nombre (solo al registrarse)">
    <input id="email" placeholder="Email" type="email">
    <input id="password" placeholder="Contraseña" type="password">
    <button onclick="login()">Iniciar sesión</button>
    <button onclick="register()">Registrarse</button>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    const apiUrl = "/auth";

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");

      const res = await fetch(`${apiUrl}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const text = await res.text();
      msg.textContent = text;
      msg.style.color = res.ok ? "lime" : "red";
    }

    async function register() {
      const nombre = document.getElementById("nombre").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");

      const res = await fetch(`${apiUrl}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, email, password })
      });

      const text = await res.text();
      msg.textContent = text;
      msg.style.color = res.ok ? "lime" : "red";
    }
  </script>
</body>
</html>
